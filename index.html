<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FABRIX Platform</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/PlusJakartaSans-Variable.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages has no SPA fallback: public/404.html bounces deep links to
      // /?p=<path>, and this restores the real URL before the router boots.
      (function () {
        var m = window.location.search.match(/[?&]p=([^&]+)/);
        if (m) {
          var path = decodeURIComponent(m[1]);
          var rest = window.location.search.replace(/[?&]p=[^&]+/, '').replace(/^&/, '?');
          window.history.replaceState(null, '', path + rest + window.location.hash);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
